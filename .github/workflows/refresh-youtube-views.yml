name: Refresh YouTube view counts

on:
  workflow_dispatch:
  # Enable the daily schedule after official YouTube data access is connected.

permissions:
  contents: write

concurrency:
  group: refresh-youtube-views
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh public YouTube counts
        run: node --import tsx scripts/refresh-youtube-views.ts
      - name: Publish refreshed counts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube-views.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh YouTube view counts"
          git pull --rebase origin main
          git push origin HEAD:main
